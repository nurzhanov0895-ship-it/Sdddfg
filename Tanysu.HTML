<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b0b">
    <title>Аяулым, тебе приглашение</title>
    <meta property="og:title" content="Для тебя кое-что есть">
    <meta property="og:description" content="Открой">
    <meta property="og:type" content="website">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500;600&family=Caveat:wght@500;700&display=swap&subset=cyrillic');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { background: #0b0b0b; -webkit-text-size-adjust: 100%; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #0b0b0b;
            color: #fff;
            font-family: 'Montserrat', Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Лёгкое зерно (эффект плёнки) */
        body::before {
            content: "";
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.07'/%3E%3C/svg%3E");
        }

        .screen {
            display: none;
            position: relative; z-index: 2;
            width: 100%; max-width: 460px; margin: 0 auto;
            min-height: 100vh; min-height: 100dvh;
            padding: 34px 24px 40px;
            flex-direction: column;
            overflow: hidden;
        }
        .screen.active { display: flex; animation: fadeIn 0.9s ease both; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

        .screen > * { position: relative; z-index: 2; }

        /* ---------- Лилии ---------- */
        .screen > .lilies {
            position: absolute; z-index: 1; pointer-events: none;
            right: -34px; bottom: -30px;
            width: min(70vw, 290px); height: auto;
            transform-origin: 85% 100%;
            animation: lilyIn 1.8s ease 0.7s both, sway 7s ease-in-out 2.5s infinite alternate;
        }
        #form > .lilies { width: min(52vw, 210px); right: -28px; }
        @keyframes lilyIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
        @keyframes sway { from { transform: rotate(-1.2deg); } to { transform: rotate(1.4deg); } }

        /* ---------- Постер (экран 1) ---------- */
        .eyebrow {
            font-size: 0.66rem; letter-spacing: 0.38em;
            color: rgba(255, 255, 255, 0.55); margin-bottom: 22px;
        }

        .pstage { --pw: min(41vw, 170px); position: relative; height: calc(var(--pw) * 2.02); margin-bottom: 8px; }

        .polaroid {
            position: absolute; width: var(--pw);
            padding: calc(var(--pw) * 0.06) calc(var(--pw) * 0.06) calc(var(--pw) * 0.27);
            background: linear-gradient(180deg, #eceeec, #dcdfdc);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            opacity: 0;
            animation: drop 1s cubic-bezier(.2, .8, .2, 1) forwards;
        }
        .pa { right: 0; top: 0; --r: 3deg; animation-delay: 0.2s; }
        .pb { left: 0; top: calc(var(--pw) * 0.8); --r: -3deg; animation-delay: 0.5s; }
        @keyframes drop {
            from { opacity: 0; transform: translateY(-30px) rotate(calc(var(--r) * 3)); }
            to   { opacity: 1; transform: translateY(0) rotate(var(--r)); }
        }

        .pic {
            aspect-ratio: 1 / 1;
            background: radial-gradient(circle at 50% 40%, #181818, #000 70%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 6px; text-align: center; color: #fff;
        }
        .pic .big { font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-size: calc(var(--pw) * 0.3); letter-spacing: 0.04em; }
        .pic .mid { font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-size: calc(var(--pw) * 0.13); letter-spacing: 0.22em; font-weight: 500; }
        .pic .sm { font-size: calc(var(--pw) * 0.075); letter-spacing: 0.08em; color: rgba(255, 255, 255, 0.7); }
        .cap {
            position: absolute; left: 0; right: 0; bottom: calc(var(--pw) * 0.06);
            text-align: center; font-family: 'Caveat', cursive;
            font-size: calc(var(--pw) * 0.15); color: #2b2b2b;
        }

        /* Карточка как в словаре */
        .dict {
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 22px 20px 24px;
            width: min(66%, 280px);
            margin-top: 12px;
        }
        #poster .dict { opacity: 0; animation: fadeUp 1s ease 1s forwards; }
        .dict .word { font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-size: 2rem; line-height: 1.1; }
        .dict .pron { font-size: 0.62rem; letter-spacing: 0.06em; color: rgba(255, 255, 255, 0.7); margin-top: 6px; }
        .dict hr { border: none; height: 1px; background: #fff; width: 80px; margin: 12px 0; }
        .dict p { font-family: 'Cormorant Garamond', 'Times New Roman', serif; font-size: 0.98rem; line-height: 1.5; color: rgba(255, 255, 255, 0.9); }

        .go {
            align-self: flex-start; margin-top: 24px;
            padding: 14px 30px; border-radius: 50px; cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.45); color: #fff;
            font: 500 0.78rem 'Montserrat', Arial, sans-serif; letter-spacing: 0.22em; text-transform: uppercase;
            transition: all 0.3s ease;
            opacity: 0; animation: fadeUp 1s ease 1.4s forwards;
        }
        .go:hover { background: #fff; color: #000; }

        /* ---------- Ответ (экран 2) ---------- */
        #form { padding-bottom: 150px; }
        .ft {
            font-family: 'Cormorant Garamond', 'Times New Roman', serif;
            font-style: italic; font-weight: 500; font-size: 2.6rem; line-height: 1.1;
        }
        .fblock { margin-top: 28px; }
        .q {
            font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6); margin-bottom: 10px;
        }
        .line {
            width: 100%; background: transparent; border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.55);
            color: #fff; padding: 10px 2px; outline: none;
            font-family: 'Cormorant Garamond', 'Times New Roman', serif;
            font-size: 1.9rem; letter-spacing: 0.06em; border-radius: 0;
        }
        .line::placeholder { color: rgba(255, 255, 255, 0.28); }
        .line:focus { border-bottom-color: #fff; }
        .line.sm { font-family: 'Montserrat', Arial, sans-serif; font-weight: 300; font-size: 1.05rem; letter-spacing: 0.02em; }

        .err { min-height: 18px; margin-top: 8px; font-size: 0.8rem; color: #e0e0e0; }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .chip {
            padding: 9px 16px; border-radius: 40px; cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: rgba(0, 0, 0, 0.35); color: #fff;
            font: 400 0.85rem 'Montserrat', Arial, sans-serif; transition: all 0.25s ease;
        }
        .chip.on { background: #fff; color: #000; border-color: #fff; }

        .note { display: none; margin-top: 22px; font-size: 0.82rem; line-height: 1.6; color: rgba(255, 255, 255, 0.75); }

        .btns { display: flex; flex-direction: column; gap: 12px; margin-top: 30px; width: min(60%, 230px); }
        .btn {
            padding: 15px 20px; border-radius: 50px; cursor: pointer;
            font: 500 0.95rem 'Montserrat', Arial, sans-serif; letter-spacing: 0.08em;
            transition: all 0.3s ease;
        }
        .b-yes { background: #fff; color: #000; border: 1px solid #fff; }
        .b-yes:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2); }
        .b-maybe { background: rgba(0, 0, 0, 0.4); color: #fff; border: 1px solid rgba(255, 255, 255, 0.6); }
        .b-maybe:hover { background: rgba(255, 255, 255, 0.12); }
        .b-no { background: rgba(0, 0, 0, 0.35); color: rgba(255, 255, 255, 0.65); border: 1px solid rgba(255, 255, 255, 0.2); }
        .b-no:hover { color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        /* ---------- Финал (экран 3) ---------- */
        #end {
            position: fixed; inset: 0; z-index: 20;
            max-width: none; margin: 0; padding: 24px;
            background: #0b0b0b;
            align-items: center; justify-content: center;
        }
        #end.active { animation: none; }
        #end .dict { width: min(88%, 340px); }

        #endCard { opacity: 0; transform: translateY(14px); }
        /* без анимации (тихий финал или повторный вход) */
        #end.show #endCard { opacity: 1; transform: none; transition: opacity 1.1s ease, transform 1.1s ease; }
        /* после полёта птицы */
        #end.fly #endCard { animation: cardIn 1.2s ease 8.9s forwards; }
        @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

        /* ---------- Письмо (конверт) ---------- */
        .letter {
            position: relative;
            width: 180px; height: 124px;
            background: #efede6;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            color: #26231f; font-family: 'Caveat', 'Comic Sans MS', cursive;
            overflow: hidden;
        }
        .letter::before {
            content: ""; position: absolute; left: 0; top: 0;
            width: 100%; height: 62px; background: #dcd9cf;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
        }
        .seal {
            position: absolute; left: 50%; top: 62px; z-index: 2;
            width: 28px; height: 28px; margin: -14px 0 0 -14px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #3a3a3a, #050505 75%);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            display: grid; place-items: center;
        }
        .seal svg { width: 14px; height: 14px; fill: #efede6; }
        .ltxt { position: absolute; left: 0; right: 0; top: 78px; text-align: center; line-height: 1.1; }
        .ltxt .a { font-size: 1.2rem; font-weight: 700; }
        .ltxt .b { font-size: 0.95rem; opacity: 0.8; }

        #paper { display: none; position: absolute; left: 50%; top: 50%; margin: -62px 0 0 -90px; z-index: 3; }

        #bird {
            display: none; position: absolute; left: 50%; top: 50%;
            width: 130px; height: 76px; z-index: 4; pointer-events: none;
            will-change: transform;
        }
        #bird > svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; overflow: visible; }
        #carried { position: absolute; left: -22px; top: 66px; z-index: 1; visibility: hidden; transform-origin: 50% 0; }

        /*
           ВРЕМЕННАЯ ШКАЛА (секунды от нажатия «Еду»):
           0.2–1.7   страница превращается в письмо
           1.7–2.3   ставится печать
           2.4–5.2   птица прилетает слева
           5.2       птица хватает письмо
           5.65–8.8  птица улетает с письмом
           8.9       появляется карточка «Жду»
        */
        #end.fly #paper { display: block; animation: letterIn 1.5s cubic-bezier(.2, .8, .2, 1) 0.2s both, paperGone 0.01s linear 5.2s forwards; }
        #end.fly #paper .seal { animation: sealPop 0.6s cubic-bezier(.3, 1.6, .5, 1) 1.7s both; }
        #end.fly #bird { display: block; animation: birdFly 6.4s linear 2.4s both; }
        #end.fly #carried { animation: carryShow 0.01s linear 5.2s forwards, swing 1.4s ease-in-out 5.2s infinite; }

        @keyframes letterIn {
            0%   { transform: scale(9); opacity: 0; }
            35%  { transform: scale(4); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes paperGone { to { visibility: hidden; } }
        @keyframes sealPop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes carryShow { to { visibility: visible; } }
        @keyframes swing {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(7deg); }
            75% { transform: rotate(-7deg); }
        }

        /* Положение птицы считается от центра экрана: (-68px, -128px) = лапы на конверте */
        @keyframes birdFly {
            0%     { transform: translate(calc(-50vw - 220px), -34vh) rotate(6deg); animation-timing-function: cubic-bezier(.35, .1, .4, 1); }
            20%    { transform: translate(-22vw, -30vh) rotate(3deg); animation-timing-function: ease-in-out; }
            38%    { transform: translate(-128px, -196px) rotate(6deg); animation-timing-function: ease-out; }
            43.75% { transform: translate(-68px, -128px) rotate(0deg); }
            50.8%  { transform: translate(-68px, -128px) rotate(0deg); animation-timing-function: ease-in; }
            62%    { transform: translate(-20px, -190px) rotate(-8deg); animation-timing-function: ease-in; }
            100%   { transform: translate(calc(50vw + 240px), -64vh) rotate(-14deg); }
        }

        /* Кнопка для проверки (видна только в тестовом режиме) */
        #testbar {
            display: none; position: fixed; top: 10px; right: 10px; z-index: 60;
            padding: 8px 14px; border-radius: 30px; cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.5); background: rgba(0, 0, 0, 0.7); color: #fff;
            font: 500 0.7rem 'Montserrat', Arial, sans-serif; letter-spacing: 0.14em;
        }
    </style>
</head>
<body>

    <!-- Лилии (рисуются один раз, используются в разных местах) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="0" y1="-104" x2="0" y2="0">
                <stop offset="0" stop-color="#fbfbfa"/><stop offset=".55" stop-color="#e2e2df"/><stop offset="1" stop-color="#8d8d8a"/>
            </linearGradient>
            <linearGradient id="pg2" gradientUnits="userSpaceOnUse" x1="0" y1="-104" x2="0" y2="0">
                <stop offset="0" stop-color="#dcdcd9"/><stop offset="1" stop-color="#5f5f5c"/>
            </linearGradient>
            <radialGradient id="throat">
                <stop offset="0" stop-color="#4a4a48"/><stop offset="1" stop-color="#4a4a48" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#1a1a1a"/><stop offset="1" stop-color="#5a5a58"/>
            </linearGradient>

            <g id="petal">
                <path d="M0 0 C-34 -24 -38 -66 0 -104 C38 -66 34 -24 0 0Z"/>
                <path d="M0 -6 L0 -90" stroke="rgba(0,0,0,.16)" stroke-width="1.4" fill="none"/>
            </g>

            <g id="lilyG">
                <g opacity=".95">
                    <use href="#petal" fill="url(#pg2)" transform="rotate(60) scale(.94)"/>
                    <use href="#petal" fill="url(#pg2)" transform="rotate(180) scale(.94)"/>
                    <use href="#petal" fill="url(#pg2)" transform="rotate(300) scale(.94)"/>
                </g>
                <use href="#petal" fill="url(#pg)" transform="rotate(0)"/>
                <use href="#petal" fill="url(#pg)" transform="rotate(120)"/>
                <use href="#petal" fill="url(#pg)" transform="rotate(240)"/>
                <circle r="34" fill="url(#throat)"/>
                <g fill="#232323" opacity=".75">
                    <circle cx="-10" cy="-22" r="1.6"/><circle cx="8" cy="-28" r="1.3"/><circle cx="-18" cy="-34" r="1.5"/>
                    <circle cx="14" cy="-40" r="1.2"/><circle cx="22" cy="-20" r="1.5"/><circle cx="-26" cy="-18" r="1.3"/>
                    <circle cx="4" cy="18" r="1.4"/><circle cx="-6" cy="28" r="1.6"/><circle cx="16" cy="26" r="1.2"/>
                    <circle cx="-20" cy="22" r="1.4"/><circle cx="-4" cy="-44" r="1.3"/><circle cx="24" cy="-34" r="1.4"/>
                </g>
                <g stroke="#a5a5a1" stroke-width="2" fill="none" stroke-linecap="round">
                    <path d="M0 0 Q10 -22 18 -52"/><path d="M0 0 Q-6 -26 -14 -56"/>
                    <path d="M0 0 Q26 -4 52 -16"/><path d="M0 0 Q-24 8 -48 6"/>
                    <path d="M0 0 Q16 22 30 44"/><path d="M0 0 Q-8 24 -22 46"/>
                </g>
                <g fill="#181818">
                    <ellipse cx="18" cy="-52" rx="3.2" ry="9" transform="rotate(20 18 -52)"/>
                    <ellipse cx="-14" cy="-56" rx="3.2" ry="9" transform="rotate(-15 -14 -56)"/>
                    <ellipse cx="52" cy="-16" rx="3.2" ry="9" transform="rotate(73 52 -16)"/>
                    <ellipse cx="-48" cy="6" rx="3.2" ry="9" transform="rotate(-85 -48 6)"/>
                    <ellipse cx="30" cy="44" rx="3.2" ry="9" transform="rotate(-35 30 44)"/>
                    <ellipse cx="-22" cy="46" rx="3.2" ry="9" transform="rotate(25 -22 46)"/>
                </g>
                <path d="M0 0 Q4 -18 2 -62" stroke="#c9c9c5" stroke-width="2.4" fill="none" stroke-linecap="round"/>
                <circle cx="2" cy="-62" r="3.4" fill="#2a2a2a"/>
            </g>

            <g id="lilies">
                <path d="M212 430 C206 340 200 270 193 195" stroke="#262626" stroke-width="7" fill="none" stroke-linecap="round"/>
                <path d="M186 430 C158 392 128 350 112 304" stroke="#2b2b2b" stroke-width="6" fill="none" stroke-linecap="round"/>
                <path d="M203 338 C240 305 280 292 306 268 C284 312 250 340 203 352Z" fill="url(#leaf)"/>
                <path d="M192 398 C150 372 105 380 66 404 C108 408 152 406 192 402Z" fill="url(#leaf)"/>
                <path d="M205 300 C232 262 262 244 292 236 C272 270 246 296 205 312Z" fill="url(#leaf)"/>
                <use href="#lilyG" transform="translate(192 128) rotate(-18) scale(1.02)"/>
                <use href="#lilyG" transform="translate(108 292) rotate(28) scale(.9)"/>
            </g>
        </defs>
    </svg>

    <button id="testbar" type="button" onclick="location.reload()">ТЕСТ · заново</button>

    <!-- ===== 1. ПОСТЕР ===== -->
    <section class="screen" id="poster">
        <div class="eyebrow">ЛИЧНОЕ ПРИГЛАШЕНИЕ</div>

        <div class="pstage">
            <div class="polaroid pa">
                <div class="pic"><span class="big">18:00</span></div>
                <div class="cap">вечер</div>
            </div>
            <div class="polaroid pb">
                <div class="pic"><span class="mid">FLOWES</span><span class="sm">Рыскулова 23.7</span></div>
                <div class="cap">ресторан</div>
            </div>
        </div>

        <div class="dict">
            <div class="word">Аяулым</div>
            <div class="pron">[аяулым] имя</div>
            <hr>
            <p>человек, с которым хочется провести вечер; тот, ради кого заказывают лучший столик.</p>
        </div>

        <button class="go" onclick="toForm()">Ответить</button>

        <svg class="lilies" viewBox="0 0 300 420"><use href="#lilies"/></svg>
    </section>

    <!-- ===== 2. ОТВЕТ ===== -->
    <section class="screen" id="form">
        <div class="eyebrow">ТВОЙ ОТВЕТ</div>
        <div class="ft">Аяулым,<br>придёшь?</div>

        <div class="fblock">
            <div class="q">Когда ты свободна? Напиши дату</div>
            <input class="line" id="date" type="text" inputmode="decimal" maxlength="10" placeholder="0.0.2026" autocomplete="off">
            <div class="err" id="err"></div>
        </div>

        <div class="fblock" style="margin-top: 14px;">
            <div class="q">Что хочешь заказать?</div>
            <div class="chips" id="chips">
                <button class="chip" type="button">Паста</button>
                <button class="chip" type="button">Стейк</button>
                <button class="chip" type="button">Рыба</button>
                <button class="chip" type="button">Суши</button>
                <button class="chip" type="button">Салат</button>
                <button class="chip" type="button">Десерт</button>
            </div>
            <input class="line sm" id="foodText" type="text" maxlength="120" placeholder="Или напиши своё..." autocomplete="off">
        </div>

        <div class="note" id="note">Ты ответила «Думаю». Когда решишь, выбери ответ.</div>

        <div class="btns">
            <button class="btn b-yes" onclick="sendAnswer('Еду')">Еду</button>
            <button class="btn b-maybe" onclick="sendAnswer('Думаю')">Думаю</button>
            <button class="btn b-no" onclick="sendAnswer('Не иду')">Не иду</button>
        </div>

        <svg class="lilies" viewBox="0 0 300 420"><use href="#lilies"/></svg>
    </section>

    <!-- ===== 3. ФИНАЛ: письмо и птица ===== -->
    <section class="screen" id="end">
        <div class="dict" id="endCard">
            <div class="word" id="endWord"></div>
            <div class="pron" id="endPron"></div>
            <hr>
            <p id="endText"></p>
        </div>

        <div class="letter" id="paper"></div>

        <div id="bird">
            <div class="letter" id="carried"></div>
            <svg viewBox="0 0 120 70">
                <!-- дальнее крыло -->
                <g transform="translate(66 38)">
                    <g>
                        <animateTransform attributeName="transform" type="rotate" values="10;-75;10" dur="0.52s" begin="-0.2s" repeatCount="indefinite"/>
                        <path d="M0 0 C-6 -22 -24 -36 -44 -40 C-34 -26 -28 -12 -20 4Z" fill="#8d8d8a"/>
                    </g>
                </g>
                <!-- хвост -->
                <path d="M20 46 L2 38 L8 47 L0 55 L22 51Z" fill="#cfcfcb"/>
                <!-- тело -->
                <path d="M18 46 C30 34 62 32 86 38 C92 36 98 36 102 40 L114 42 L102 46 C96 52 84 54 74 54 C52 58 30 56 18 46Z" fill="#f3f3f0"/>
                <path d="M104 41 L114 42 L104 45Z" fill="#bdbdb8"/>
                <circle cx="95" cy="40" r="1.7" fill="#111"/>
                <!-- лапы -->
                <path d="M56 54 L56 65 M52 66 L60 66 M68 54 L68 65 M64 66 L72 66" stroke="#cfcfcb" stroke-width="1.6" stroke-linecap="round" fill="none"/>
                <!-- ближнее крыло -->
                <g transform="translate(58 40)">
                    <g>
                        <animateTransform attributeName="transform" type="rotate" values="10;-75;10" dur="0.52s" repeatCount="indefinite"/>
                        <path d="M0 0 C-6 -22 -24 -36 -44 -40 C-34 -26 -28 -12 -20 4Z" fill="#ffffff"/>
                    </g>
                </g>
            </svg>
        </div>

        <svg class="lilies" viewBox="0 0 300 420"><use href="#lilies"/></svg>
    </section>

    <script>
        const $ = id => document.getElementById(id);
        const KEY = 'ayaulym_invite_ru_v1';
        const wait = ms => new Promise(r => setTimeout(r, ms));

        // Тестовый режим: открой страницу со словом test в конце ссылки (…/#test или …/?test).
        // В нём ответ не отправляется на почту и не запоминается, можно смотреть анимацию сколько угодно.
        const TEST = /[?&#]test\b/.test(location.search + location.hash);
        if (TEST) $('testbar').style.display = 'block';

        const poster = $('poster'), form = $('form'), endEl = $('end');
        const dateInput = $('date'), foodText = $('foodText'), errBox = $('err');
        const chips = document.querySelectorAll('.chip');
        const paper = $('paper'), carried = $('carried');

        function show(el) {
            [poster, form, endEl].forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            window.scrollTo(0, 0);
        }
        function toForm() { show(form); }

        /* ---------- Выбор еды ---------- */
        chips.forEach(c => c.addEventListener('click', () => c.classList.toggle('on')));

        /* ---------- Ввод даты: 7.11.2026 или 07.11.2026 ---------- */
        dateInput.addEventListener('input', e => {
            let v = dateInput.value.replace(/[,\/\- ]/g, '.').replace(/[^\d.]/g, '').replace(/\.{2,}/g, '.').slice(0, 10);
            if (e.inputType !== 'deleteContentBackward') {
                if (/^\d{2}$/.test(v) || /^\d{1,2}\.\d{2}$/.test(v)) v += '.';
            }
            dateInput.value = v;
            errBox.textContent = '';
        });

        function parseDate(s) {
            const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(s.trim());
            if (!m) return null;
            const d = +m[1], mo = +m[2], y = +m[3];
            const dt = new Date(y, mo - 1, d);
            if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
            const t = new Date(); t.setHours(0, 0, 0, 0);
            if (dt < t) return null;
            const p = n => String(n).padStart(2, '0');
            return p(d) + '.' + p(mo) + '.' + y;
        }

        /* ---------- Тексты финала ---------- */
        const ENDS = {
            'Еду': {
                word: 'Жду', pron: '[жду] глагол',
                text: d => 'Буду ждать тебя ' + (d ? d + ' ' : '') + 'в 18:00 в FLOWES. Обо всём остальном я позабочусь.'
            },
            'Думаю': {
                word: 'Не спеши', pron: '[не спеши] фраза',
                text: () => 'Подумай, я подожду. Если вернёшься на эту страницу, приглашение будет здесь.'
            },
            'Не иду': {
                word: 'Понял', pron: '[понял] глагол',
                text: () => 'Ничего страшного. Спасибо за честный ответ.'
            }
        };

        const SEAL = '<div class="seal"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>';

        function letterInner(answer, date) {
            return SEAL +
                '<div class="ltxt"><div class="a">' + answer + (date ? ' · ' + date : '') + '</div>' +
                '<div class="b">FLOWES · 18:00</div></div>';
        }

        function fillEnd(answer, date) {
            const e = ENDS[answer] || ENDS['Не иду'];
            $('endWord').textContent = e.word;
            $('endPron').textContent = e.pron;
            $('endText').textContent = e.text(date);
            paper.innerHTML = letterInner(answer, date);
            carried.innerHTML = letterInner(answer, date);
        }

        // Показать финальную карточку без анимации птицы
        function showCardOnly() {
            show(endEl);
            requestAnimationFrame(() => requestAnimationFrame(() => endEl.classList.add('show')));
        }

        /* ---------- Отправка ответа ---------- */
        async function sendAnswer(answer) {
            const raw = dateInput.value.trim();
            const date = raw ? parseDate(raw) : '';

            if (answer === 'Еду' && !date) {
                errBox.textContent = 'Напиши дату в формате день.месяц.год';
                dateInput.focus();
                return;
            }
            if (raw && !date) {
                errBox.textContent = 'Проверь дату: день.месяц.год, прошедшие дни не подходят';
                return;
            }

            document.querySelectorAll('.btn').forEach(b => b.disabled = true);

            if (!TEST) {
                const picked = Array.from(chips).filter(c => c.classList.contains('on')).map(c => c.textContent);
                const own = foodText.value.trim();
                const food = picked.join(', ') || 'не выбрано';

                const formData = {
                    access_key: "da881848-4663-4947-8d99-ed9c3de01b49",
                    subject: "Ответ Аяулым: " + answer,
                    from_name: "Страница приглашения",
                    answer: answer,
                    date: date || "не указана",
                    food: food,
                    food_own_text: own || "не указано",
                    message: "Ответ Аяулым: " + answer +
                             ". Свободна: " + (date || "не указана") +
                             ". Еда: " + food +
                             ". Своё: " + (own || "не указано") +
                             ". FLOWES, 18:00."
                };

                try {
                    const res = await fetch("https://api.web3forms.com/submit", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Accept": "application/json" },
                        body: JSON.stringify(formData)
                    });
                    if (!res.ok) throw new Error("fail");
                } catch (err) {
                    alert("Не получилось отправить. Попробуй ещё раз.");
                    document.querySelectorAll('.btn').forEach(b => b.disabled = false);
                    return;
                }

                try { localStorage.setItem(KEY, JSON.stringify({ answer: answer, date: date })); } catch (e) {}
            }

            fillEnd(answer, date);
            form.style.transition = 'opacity .6s ease';
            form.style.opacity = '0';
            await wait(650);
            form.style.opacity = '';
            form.style.transition = '';

            if (answer === 'Еду') {
                // Письмо и птица: только для «Еду». Всю анимацию ведёт CSS (класс fly).
                show(endEl);
                endEl.classList.add('fly');
            } else {
                showCardOnly();
            }
        }

        /* ---------- При открытии: проверяем сохранённый ответ ---------- */
        (function init() {
            let s = null;
            if (!TEST) { try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} }

            if (s && (s.answer === 'Еду' || s.answer === 'Не иду')) {
                fillEnd(s.answer, s.date);
                showCardOnly();
            } else if (s && s.answer === 'Думаю') {
                show(form);
                $('note').style.display = 'block';
                if (s.date) dateInput.value = s.date;
            } else {
                show(poster);
            }
        })();
    </script>
</body>
</html>
